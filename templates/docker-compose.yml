# @@NAME@@ for Runtipi: the official browser build of @@NAME@@ (@@REPO@@), served by nginx.
# Generated from crafts.json by scripts/generate.ts. Edit the template or crafts.json, not this file.
#
# On the first start after an install or update, the container downloads the release's web zip
# from GitHub, checks it against the SHA-256 pinned below, unpacks it into ${APP_DATA_DIR}/data/site,
# and serves it. Later starts reuse the unpacked copy. The app runs entirely in the browser; the
# server only hands out files.
#
# Every start also writes this store's save-in-place script (shim/savehere.js, base64 below) next
# to the app and, unless the "Save in place" setting is off, loads it first in index.html. In
# Chrome, Edge and Brave it makes Save write into the file you opened instead of downloading.
x-runtipi:
  schema_version: 2
  overrides: []

services:
  @@ID@@:
    image: nginx:1.30.6-alpine
    environment:
      CRAFT_NAME: "@@NAME@@"
      CRAFT_VERSION: "@@VERSION@@"
      CRAFT_URL: "https://github.com/@@REPO@@/releases/download/@@TAG@@/@@ASSET@@"
      CRAFT_SHA256: "@@SHA256@@"
      SAVE_IN_PLACE: ${CRAFT_SAVE_IN_PLACE:-true}
      SAVEHERE_REMEMBER_OPENED: "@@REMEMBER_OPENED@@"
      SAVEHERE_JS_B64: "@@SAVEHERE_B64@@"
    volumes:
      - ${APP_DATA_DIR}/data/site:/site
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        site="/site/$$CRAFT_VERSION"
        if [ ! -f "$$site/.complete" ]; then
          echo "Downloading $$CRAFT_NAME $$CRAFT_VERSION from $$CRAFT_URL"
          rm -rf /site/.download
          mkdir -p /site/.download/unpacked
          wget -q -O /site/.download/web.zip "$$CRAFT_URL"
          echo "$$CRAFT_SHA256  /site/.download/web.zip" | sha256sum -c -
          unzip -q /site/.download/web.zip -d /site/.download/unpacked
          root=/site/.download/unpacked
          # The release zips hold a single folder, e.g. effectcraft-web-0.24.1/.
          if [ ! -f "$$root/index.html" ] && [ "$$(ls -A "$$root" | wc -l)" -eq 1 ]; then
            root="$$root/$$(ls -A "$$root")"
          fi
          if [ ! -f "$$root/index.html" ]; then
            echo "The release has no index.html" >&2
            exit 1
          fi
          cp "$$root/index.html" "$$root/index.orig.html"
          # Compress the large files once, for nginx's gzip_static.
          find "$$root" -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.html' \) \
            -exec sh -c 'gzip -6 -c "$$1" > "$$1.gz"' _ {} \;
          rm -rf "$$site"
          mv "$$root" "$$site"
          touch "$$site/.complete"
          rm -rf /site/.download
          # Remove earlier versions' files.
          for old in /site/*; do
            if [ "$$old" != "$$site" ]; then rm -rf "$$old"; fi
          done
          echo "Installed $$CRAFT_NAME $$CRAFT_VERSION"
        fi
        # Some releases' app/ folder imports snippets/ beside itself without shipping a copy
        # (PhotoCraft 0.23.1 stops at "Loading…"): give it the top-level one.
        if [ -d "$$site/app" ] && [ -d "$$site/snippets" ] && [ ! -e "$$site/app/snippets" ]; then
          cp -R "$$site/snippets" "$$site/app/snippets"
        fi
        # Save in place: rewritten on every start, so a store update or a settings change applies.
        if [ ! -f "$$site/index.orig.html" ]; then cp "$$site/index.html" "$$site/index.orig.html"; fi
        echo "$$SAVEHERE_JS_B64" | base64 -d > "$$site/savehere.js"
        cp "$$site/index.orig.html" "$$site/index.html"
        if [ "$$SAVE_IN_PLACE" != "false" ]; then
          attrs=""
          if [ "$$SAVEHERE_REMEMBER_OPENED" = "false" ]; then attrs=' data-remember-opened="false"'; fi
          sed -i "s#<head\([^>]*\)>#<head\1><script src=\"savehere.js\"$$attrs></script>#" "$$site/index.html"
          echo "Save in place: on"
        else
          echo "Save in place: off"
        fi
        gzip -6 -c "$$site/index.html" > "$$site/index.html.gz"
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          root SITE_ROOT;
          index index.html;
          absolute_redirect off;
          gzip_static on;
          # File names stay the same between releases, so browsers must revalidate every file.
          add_header Cache-Control "no-cache" always;
          add_header X-Content-Type-Options "nosniff" always;

          location / {
            try_files $$uri $$uri/ =404;
          }
          location ~* \.wasm$$ {
            default_type application/wasm;
          }
          location ~* \.webmanifest$$ {
            default_type application/manifest+json;
          }
        }
        EOF
        sed -i "s#SITE_ROOT#$$site#" /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start downloads and unpacks the release.
      start_period: 10m
    x-runtipi:
      is_main: true
      internal_port: 8080
